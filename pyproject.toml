[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-vibe-coding"
version = "0.1.0"
description = "Production-ready FastAPI skeleton with SQLAlchemy, Alembic, and Article CRUD"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "SQLAlchemy>=2.0.32",
  "alembic>=1.13.2",
  "psycopg2-binary>=2.9.9",
  "aiosqlite>=0.20.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=6.0.0",
  "pytest-timeout>=2.3.1",
  "httpx>=0.27.2",
  "ruff>=0.6.3",
]

[project.urls]
homepage = "https://example.com"

[tool.setuptools]
packages = { find = { where = ["app"], include = ["app*" ] } }

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
ignore = []

[tool.pytest.ini_options]
# Test discovery configuration
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Python path configuration
pythonpath = ["."]

# Ignore virtual environment directories
norecursedirs = [
    "venv",
    ".venv",
    "env",
    ".env",
    ".git",
    ".tox",
    "dist",
    "build",
    "*.egg-info",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".coverage",
    "tmp",
    "logs"
]

# Test execution configuration
addopts = [
    "-v",                    # Verbose output
    "--tb=short",           # Shorter traceback format
    "--strict-markers",     # Strict marker configuration
    "--strict-config",      # Strict configuration
    "--disable-warnings",   # Disable warnings during tests
    "--color=yes",          # Colored output
    "--durations=10",       # Show 10 slowest tests
]

# Markers for categorizing tests
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "api: marks tests as API tests",
    "background: marks tests as background job tests",
]

# Async test configuration
asyncio_mode = "auto"

# Minimum version requirements
minversion = "8.0"

# Coverage configuration (if using pytest-cov)
# addopts = [
#     "--cov=app",
#     "--cov-report=term-missing",
#     "--cov-report=html",
#     "--cov-report=xml",
#     "--cov-fail-under=80"
# ]

